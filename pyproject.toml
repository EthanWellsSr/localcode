[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "localcode"
version = "0.1.0"
description = "A small opencode-style coding agent for local Ollama models"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
localcode = "localcode:main"

[tool.setuptools]
py-modules = ["localcode"]
